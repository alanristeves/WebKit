<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebKit PS5</title>
<link rel="stylesheet" href="main.css?v=final">
<style>
body { 
    background: radial-gradient(circle at 50% 28%, #001f4d 0%, #000b1a 44%, #000000 100%) !important; 
    color: #ffffff !important; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important; /* Letra mais limpa e moderna */
    line-height: 1.6 !important; /* Melhor espaçamento entre linhas de texto */
}

h1 { 
    color: #00439c !important; 
    font-weight: 700 !important;
    letter-spacing: -0.5px !important; /* Letras ligeiramente mais juntas, estilo premium */
    text-shadow: 0 2px 10px rgba(0, 67, 156, 0.3) !important; /* Brilho sutil atrás do título */
}

.btn { 
    background: #00439c !important; 
    border: 2px solid #0072ce !important; 
    color: #ffffff !important; 
    border-radius: 8px !important; /* Cantos suavizados e modernos */
    padding: 10px 24px !important; /* Mais espaço interno para o botão respirar */
    font-weight: 600 !important;
    text-transform: uppercase !important; /* Letras maiúsculas estilo menu de jogo */
    letter-spacing: 1px !important;
    box-shadow: 0 4px 15px rgba(0, 114, 206, 0.2) !important; /* Sombra azul brilhante */
    transition: all 0.3s ease !important; /* Efeito suave ao passar o mouse */
    cursor: pointer !important;
}

.btn:hover {
    background: #0072ce !important; /* O botão acende */
    border-color: #00a3ff !important;
    box-shadow: 0 0 20px rgba(0, 163, 255, 0.6) !important; /* Brilho neon intenso */
    transform: translateY(-2px) !important; /* O botão sobe de leve */
}

.text-secondary { 
    color: #0072ce !important; 
    font-weight: 500 !important;
}

#top-bar-text { 
    color: #0072ce !important; 
    font-weight: 500 !important;
    letter-spacing: 0.5px !important;
}
</style>
</head>
<body>
<div class="p-2">
<h1 class="text-center">WebKit</h1>
<p class="text-center" id="top-bar-text">Current Firmware: <span class="fw-bold" id="current-fw">Unknown</span></p>
<p class="text-center text-secondary">POOPS: 7.00-12.00 | P2JB: 12.02-12.70</p>
</div>
<div id="main-content">
<div id="pre-jb-view" class="selected">
<a tabindex="0" class="btn fw-bold" id="run-jb">Jailbreak</a>
<p id="fw-status" hidden></p>
</div>
</div>
<div class="position-relative text-center p-2 mb-2">
<p class="text-secondary">Credits</p>
<p class="text-secondary mt-2">Jordy, Egy, small dog, dr b, Zeco, Gezine, Echostretch, Ufm42, TheFloW, John Tornblom, Flatz, Idlesauce and PS5 R&amp;D Discord.</p>
</div>
<script>
try {
var POOPS_HREF = "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol"
+ "&attempts=8&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,"
+ "ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&log=debug"
+ "&payload=1&v=final";
var P2JB_HREF = "slopkit/p2jb.html?go=1&auto=1&production=1&log=debug"
+ "&payload=1&v=final";
var POOPS_FIRMWARES = [
  "7.00", "7.01", "7.20", "7.40", "7.60", "7.61",
  "8.00", "8.20", "8.40", "8.60",
  "9.00", "9.05", "9.20", "9.40", "9.60",
  "10.00", "10.01", "10.20", "10.40", "10.60",
  "11.00", "11.20", "11.40", "11.60", "12.00"
];
var P2JB_FIRMWARES = [
  "12.02", "12.20", "12.40", "12.60", "12.70"
];
var ua = navigator.userAgent;
var fwStr = "";
var marker = "PlayStation 5/";
var idx = ua.indexOf(marker);
if (idx >= 0) {
  fwStr = ua.substring(idx + marker.length).split(" ")[0].split(";")[0].split(")")[0];
}
var el = document.getElementById("current-fw");
el.textContent = fwStr || "Not detected";
var jbButton = document.getElementById("run-jb");
var fwStatus = document.getElementById("fw-status");
var href = "";
if (POOPS_FIRMWARES.indexOf(fwStr) !== -1) href = POOPS_HREF;
else if (P2JB_FIRMWARES.indexOf(fwStr) !== -1) href = P2JB_HREF;
if (href) {
  jbButton.setAttribute("href", href);
  try { jbButton.focus(); } catch (e) { }
} else {
  jbButton.classList.add("btn-disabled");
  jbButton.setAttribute("aria-disabled", "true");
  fwStatus.hidden = false;
  fwStatus.textContent = "Unsupported firmware"
  + (fwStr ? ": " + fwStr : "")
  + ". Supported: 7.00-12.00 (Poopsploit), 12.02-12.70 (P2JB).";
}
} catch (e) { }
</script>
</body>
</html>
