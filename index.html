<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebKit</title>
    <link rel="stylesheet" href="main.css">
    <style>
        body { background: radial-gradient(circle at 50% 28%, #1a0a00 0, #0d0500 44%, #000000 100%) !important; color: #ff6b00 !important; font-family: sans-serif; }
        h1 { color: #ff6b00 !important; }
        .btn { background: #1a0a00 !important; border: 2px solid #ff6b00 !important; color: #ffaa44 !important; text-decoration: none; display: inline-block; padding: 10px 20px; border-radius: 4px; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #331400 !important; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .text-secondary { color: #cc5500 !important; }
        #top-bar-text { color: #cc5500 !important; }
        .text-center { text-align: center; }
        #fw-status { color: #ff3333; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="p-2">
        <h1 class="text-center">NADA REPUBLICANO</h1>
        <p class="text-center" id="top-bar-text">Current Firmware: <span class="fw-bold" id="current-fw">Detecting...</span></p>
        <p class="text-center text-secondary">POOPS: 7.00-12.00 | P2JB: 12.02-12.70</p>
    </div>

    <div id="main-content" class="text-center">
        <div id="pre-jb-view" class="selected">
            <!-- Texto inicial para o usuário saber que a página está sendo lida pelo sistema -->
            <a href="#" tabindex="0" class="btn fw-bold" id="run-jb">Carregando Estruturas...</a>
            <p id="fw-status" hidden></p>
        </div>
    </div>

    <div class="position-relative text-center p-2 mb-2" style="margin-top: 40px;">
        <p class="text-secondary">Credits</p>
        <p class="text-secondary mt-2">Jordy, Egy, small dog, dr b, Zeco, Gezine, Echostretch, Ufm42, TheFloW, John Tornblom, Flatz, Idlesauce and PS5 R&amp;D Discord.</p>
    </div>

    <script>
    try {
        var POOPS_HREF = "slopkit/poops.html?go=1&auto=1&production=1&trigger=netcontrol"
        + "&attempts=8&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,"
        + "ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&log=debug"
        + "&payload=../ProsperoMgr.elf&v=final";

        var P2JB_HREF = "slopkit/p2jb.html?go=1&auto=1&production=1&log=debug"
        + "&payload=../ProsperoMgr.elf&v=final";

        var POOPS_FIRMWARES = [
          "7.00", "7.01", "7.20", "7.40", "7.60", "7.61", "8.00", "8.20", "8.40", "8.60",
          "9.00", "9.05", "9.20", "9.40", "9.60", "10.00", "10.01", "10.20", "10.40", "10.60",
          "11.00", "11.20", "11.40", "11.60", "12.00"
        ];
        var P2JB_FIRMWARES = [
          "12.02", "12.20", "12.40", "12.60", "12.70"
        ];

        var ua = navigator.userAgent;
        var fwStr = "";
        
        // Leitura via Expressão Regular estável para o console
        var match = ua.match(/PlayStation 5\/([0-9.]+)/);
        if (match && match[1]) {
            fwStr = match[1];
        }

        var el = document.getElementById("current-fw");
        var jbButton = document.getElementById("run-jb");
        var fwStatus = document.getElementById("fw-status");
        var href = "";

        if (fwStr) {
            el.textContent = fwStr;

            if (POOPS_FIRMWARES.indexOf(fwStr) !== -1) {
                href = POOPS_HREF;
            } else if (P2JB_FIRMWARES.indexOf(fwStr) !== -1) {
                href = P2JB_HREF;
            }

            if (href) {
                jbButton.setAttribute("href", href);
                
                // ⏱️ INICIALIZAÇÃO SEGURA: Aguarda 4 segundos (4000ms) para carregar todas as
                // estruturas na memória antes de forçar o avanço automático.
                setTimeout(function() {
                    jbButton.textContent = "Iniciando Jailbreak...";
                    setTimeout(function() {
                        jbButton.click();
                    }, 500);
                }, 4000);

            } else {
                jbButton.textContent = "Não Suportado";
                jbButton.classList.add("btn-disabled");
                jbButton.removeAttribute("href");
                fwStatus.hidden = false;
                fwStatus.textContent = "Firmware (" + fwStr + ") não suportado.";
            }
        } else {
            el.textContent = "Não Detectado (PC/Celular)";
            jbButton.textContent = "Apenas no PS5";
            jbButton.classList.add("btn-disabled");
            jbButton.removeAttribute("href");
        }
    } catch (e) { }
    </script>
</body>
</html>
